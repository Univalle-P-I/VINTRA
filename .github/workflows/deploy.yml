name: Deploy hacia el VPS

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtención código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verificar API y PostgreSQL públicos
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING || 'http://vintra.qsuene.com:8080/api' }}
          ALLOW_INSECURE_HTTP: 'true'
        run: node ../scripts/check-public-api.mjs

      - name: Instalar dependencias y compilar
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING || 'http://vintra.qsuene.com:8080/api' }}
        run: |
          npm ci
          npm run build

      - name: Publicar frontend en staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: frontend/dist/
          target: /var/www/vintra.qsuene.com/html-dev
          strip_components: 2
          overwrite: true
          rm: false
