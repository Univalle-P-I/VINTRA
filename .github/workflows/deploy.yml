name: Deploy hacia el VPS

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: vintra-vps-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtención código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y compilar
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Validar secretos de despliegue
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Falta el secreto HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Falta el secreto USERNAME"; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "::error::Falta el secreto SSH_KEY"; exit 1; }

      - name: Transferir archivos a carpeta temporal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: frontend/dist/*
          target: /tmp/vintra_build
          strip_components: 2
          rm: true

      - name: Verificar y publicar cambios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -eu
            source=/tmp/vintra_build
            live=/var/www/vintra.qsuene.com
            test -s "$source/index.html"
            test -d "$live"

            backup="$(mktemp -d /tmp/vintra_backup.XXXXXX)"
            cp -a "$live/." "$backup/"
            if ! find "$live" -mindepth 1 ! -name '.htaccess' -exec rm -rf -- {} + ||
               ! cp -a "$source/." "$live/"; then
              find "$live" -mindepth 1 ! -name '.htaccess' -exec rm -rf -- {} +
              cp -a "$backup/." "$live/"
              exit 1
            fi

            rm -rf "$backup" "$source"
