name: Deploy de producción hacia el VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtención código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verificar API y PostgreSQL públicos
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_PRODUCTION || 'https://vintra.qsuene.com/api' }}
        run: node ../scripts/check-public-api.mjs

      - name: Instalar dependencias y compilar
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_PRODUCTION || 'https://vintra.qsuene.com/api' }}
        run: |
          npm ci
          npm run build

      - name: Publicar frontend en producción
        uses: appleboy/scp-action@d91a1af6f57cd4478ceee14d7705601dafabaa19
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: frontend/dist/
          target: /var/www/vintra.qsuene.com/html-main
          strip_components: 2
          overwrite: true
          rm: false
