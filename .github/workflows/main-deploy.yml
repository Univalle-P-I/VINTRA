name: Deploy de producción hacia el VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtención código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias y compilar
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Transferir archivos a carpeta temporal
        uses: appleboy/scp-action@d91a1af6f57cd4478ceee14d7705601dafabaa19
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "frontend/dist/*"
          target: "/var/www/vintra.qsuene.com/html-main"
          strip_components: 1
          overwrite: true
          rm: false

      - name: Publicar cambios en pruebas (manteniendo .htaccess)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            find /var/www/vintra.qsuene.com/html-main -mindepth 1 ! -name '.htaccess' -exec rm -rf {} +
            cp -r /tmp/vintra_build/* /var/www/vintra.qsuene.com/html-main
            rm -rf /tmp/vintra_build