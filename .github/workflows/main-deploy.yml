name: CD Producción to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar despliegue principal en VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY}}
          port: 22
          script: |
            set -e

            TARGET_DIR="/var/www/vintra.qsuene.com/html-main"

            if [ ! -d "$TARGET_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main

            docker compose -p vintra-main up -d --build
            docker image prune -f
