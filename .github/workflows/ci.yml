name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  repository-checks:
    name: Check changed lines for whitespace errors
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            base="$(git merge-base "origin/$PR_BASE_REF" "$head")"
          elif [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            echo "No previous commit to compare; skipping diff check."
            exit 0
          fi

          git diff --check "$base" "$head"

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            docs/**/*.md

  check-links:
    name: Check links in README
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          file-path: './README.md'
          config-file: 'mlc_config.json'

  backend:
    name: Backend CI (Modular)
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend CI (Modular)
    uses: ./.github/workflows/frontend.yml
