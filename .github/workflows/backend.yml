name: Backend CI

on:
  workflow_call:

jobs:
  backend-checks:
    name: Backend CI Job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vintra-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vintra-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:cov -- --runInBand

      - name: Build backend
        run: npm run build
